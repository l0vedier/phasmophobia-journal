<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a120a">
<title>恐鬼症笔记</title>
<link rel="stylesheet" href="mobile.css">
</head>
<body>

<div class="book">
  <div class="book-frame" aria-hidden="true"></div>

  <div class="pager" id="pager">

    <!-- 1 证据 -->
    <section class="page" id="pEvidence" aria-label="证据">
      <header class="page-head">
        <h1 class="page-title">证据</h1>
        <span class="page-no">1 / 3</span>
      </header>
      <div class="page-scroll">
        <ul class="evidence-list" id="evidenceList"></ul>
        <div class="page-foot-row">
          <p class="page-foot">点一下：勾选 → 划除 → 取消</p>
          <button class="reset-btn" id="resetBtn" type="button">重置</button>
        </div>
      </div>
    </section>

    <!-- 2 鬼魂 -->
    <section class="page" id="pGhost" aria-label="鬼魂">
      <header class="page-head">
        <h1 class="page-title">鬼魂</h1>
        <span class="page-no">2 / 3</span>
      </header>
      <div class="page-scroll" id="ghostScroll">
        <p class="hint" id="ghostHint">根据找到的证据，可能是</p>
        <div class="ghost-grid" id="ghostGrid"></div>
        <p class="page-foot">点一下圈住 · 长按看资料</p>
      </div>
      <div class="page-tab-zone" id="ghostZone">
        <span class="page-tab"><span class="tab-arrow">﹀</span>鬼魂通用规则</span>
      </div>
    </section>

    <!-- 3 诅咒之物 -->
    <section class="page" id="pCursed" aria-label="诅咒之物">
      <header class="page-head">
        <h1 class="page-title">诅咒之物</h1>
        <span class="page-no">3 / 3</span>
      </header>
      <div class="page-scroll" id="cursedScroll">
        <p class="hint">每局随机一件，点名字看介绍</p>
        <div class="cursed-names" id="cursedNames"></div>
      </div>
      <div class="page-tab-zone" id="cursedZone">
        <span class="page-tab"><span class="tab-arrow">﹀</span>诅咒物通用规则</span>
      </div>
    </section>

  </div>

  <!-- 左右翻页提示 -->
  <button class="edge-hint edge-left" id="hintLeft" type="button" aria-label="上一页">
    <span class="edge-arrow">‹</span>
    <span class="edge-label" id="labelLeft">证据</span>
  </button>
  <button class="edge-hint edge-right" id="hintRight" type="button" aria-label="下一页">
    <span class="edge-label" id="labelRight">鬼魂</span>
    <span class="edge-arrow">›</span>
  </button>

  <!-- 鬼魂资料 -->
  <div class="sheet" id="ghostSheet" aria-hidden="true">
    <div class="sheet-paper">
      <header class="sheet-head">
        <h2 class="sheet-title" id="sheetTitle"></h2>
        <span class="sheet-en" id="sheetEn"></span>
        <button class="sheet-back" id="sheetBack" type="button">‹ 返回</button>
      </header>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <!-- 诅咒之物介绍 -->
  <div class="sheet" id="cursedSheet" aria-hidden="true">
    <div class="sheet-paper">
      <header class="sheet-head">
        <h2 class="sheet-title" id="cursedSheetTitle"></h2>
        <span class="sheet-en" id="cursedSheetEn"></span>
        <button class="sheet-back" id="cursedSheetBack" type="button">‹ 返回</button>
      </header>
      <div class="sheet-body" id="cursedSheetBody"></div>
    </div>
  </div>

  <!-- 通用规则（从顶部向下拉出来） -->
  <div class="drawer-backdrop" id="rulesBackdrop"></div>
  <div class="drawer" id="rulesSheet" aria-hidden="true">
    <div class="drawer-grip"></div>
    <header class="sheet-head">
      <h2 class="sheet-title" id="rulesSheetTitle"></h2>
      <span class="sheet-en" id="rulesSheetEn"></span>
      <button class="sheet-back" id="rulesSheetBack" type="button">‹ 收起</button>
    </header>
    <div class="sheet-body" id="rulesSheetBody"></div>
  </div>
</div>

<script src="ghost_info.js"></script>
<script src="mobile.js"></script>
</body>
</html>
